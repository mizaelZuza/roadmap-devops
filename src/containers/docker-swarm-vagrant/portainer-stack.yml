version: '3.8'

networks:
  public-net:
    external: true
    name: meu-cluster_public-net
  agent-net:
    driver: overlay

services:
  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.portainer_agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - public-net
      - agent-net
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portainer-rota.entrypoints=web"
        - "traefik.http.routers.portainer-rota.rule=Host(`portainer.swarm.lan`)"
        - "traefik.http.services.portainer-servico.loadbalancer.server.port=9000"

  agent:
    image: portainer/agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent-net
    deploy:
      mode: global

volumes:
  portainer_data:
